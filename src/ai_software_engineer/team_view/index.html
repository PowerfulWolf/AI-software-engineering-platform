<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>团队工作台 · ai-software-engineer</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="monogram">ae</span><span>AI Software<br />Engineer</span>
      </div>
      <p class="nav-label">团队工作台</p>
      <nav aria-label="主导航">
        <button id="nav-team" class="selected" aria-current="page">
          团队成员
        </button>
        <button id="nav-requests">需求与交付</button>
        <button id="nav-knowledge">团队知识库</button>
        <button id="nav-settings">设置</button>
        <button id="nav-status">状态</button>
      </nav>
      <div class="side-note">
        本地团队工作台<br />需求操作由 Manager 接管
      </div>
    </aside>
    <main>
      <header>
        <div>
          <p id="team">正在连接 Team 工作空间</p>
          <h1 id="heading">团队成员</h1>
        </div>
        <div class="header-actions">
          <button id="new-request" class="primary" hidden>新建需求</button>
          <button id="refresh">刷新</button>
        </div>
      </header>
      <div id="connection" role="status" aria-live="polite">
        正在读取真实运行记录…
      </div>
      <div
        id="projects"
        class="team-tabs"
        role="tablist"
        aria-label="Projects"
      ></div>
      <p id="explanation" class="explanation">
        项目、需求、批准和继续交付都在这里完成。任务阶段来自持久化记录；“空闲中”只表示
        当前没有分配给该成员的未结束任务。
      </p>
      <section id="composer" hidden aria-label="新建需求"></section>
      <section
        id="operations"
        aria-live="polite"
        aria-label="操作状态"
      ></section>
      <section id="content" aria-label="工作台内容"></section>
      <section id="detail" hidden aria-label="详情"></section>
    </main>
  </body>
</html>
