[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-software-engineer"
dynamic = ["version"]
description = "A Trellis-inspired, artifact-driven multi-agent software engineering platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "pymysql>=1.1,<2",
  "typer>=0.12,<1",
]

[project.scripts]
ase = "ai_software_engineer.cli:main"

[project.urls]
Repository = "https://github.com/PowerfulWolf/AI-software-engineering-platform"

[dependency-groups]
dev = [
  "jsonschema[format]>=4,<5",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "types-jsonschema>=4,<5",
  "types-pymysql>=1.1,<2",
]

[tool.hatch.version]
path = "src/ai_software_engineer/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_software_engineer"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
  "mysql: integration tests requiring ASE_TEST_MYSQL_DSN",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
