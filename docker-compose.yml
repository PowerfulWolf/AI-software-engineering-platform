name: ai-software-engineer

services:
  mysql:
    image: mysql:8.0
    container_name: ase-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: ${ASE_MYSQL_DATABASE:-ai_software_engineer}
      MYSQL_USER: ${ASE_MYSQL_USER:-ase}
      MYSQL_PASSWORD: ${ASE_MYSQL_PASSWORD:-ase_local_change_me}
      MYSQL_ROOT_PASSWORD: ${ASE_MYSQL_ROOT_PASSWORD:-ase_root_local_change_me}
    ports:
      - "127.0.0.1:${ASE_MYSQL_PORT:-3307}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER
          -p$$MYSQL_PASSWORD --silent
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - ase_mysql_data:/var/lib/mysql

volumes:
  ase_mysql_data:
    name: ai-software-engineer-mysql-data
